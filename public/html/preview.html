<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planning Board Export</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="canvas-workspace pb-style-1">
      <div class="artboard desktop pb-style-2" data-layer-id="page">
        <div class="custom-layer-stack pb-style-3" style="">
          <div
            data-layer-id="custom-layer-1787300879610"
            class="custom-canvas-layer layer pb-style-4"
            data-layer-label="New Layer"
          ></div>
          <div
            data-layer-id="custom-section-1787300886267"
            class="custom-canvas-layer section pb-style-5"
            data-layer-label="New Section"
          >
            <div class="custom-layer-children pb-style-7" style="">
              <div
                data-layer-id="custom-checkbox-1787300906644"
                class="custom-canvas-layer checkbox pb-style-8"
                data-layer-label="New Checkbox"
              >
                <span class="custom-layer-content pb-style-9" style=""
                  ><span class="canvas-option-list horizontal pb-style-10" style=""
                    ><label class="canvas-option-item pb-style-11" style=""
                      ><input type="checkbox" value="1" class="pb-style-12" style="" /><span
                        class="pb-style-13"
                        style=""
                        >option1</span
                      ></label
                    ><label class="canvas-option-item pb-style-11" style=""
                      ><input type="checkbox" value="2" class="pb-style-12" style="" /><span
                        class="pb-style-13"
                        style=""
                        >option2</span
                      ></label
                    ></span
                  ></span
                >
              </div>
            </div>
          </div>
          <div
            data-layer-id="custom-icon-1787300933443"
            class="custom-canvas-layer icon pb-style-14"
            data-layer-label="New Icon"
          >
            <span class="custom-layer-content pb-style-15" style=""
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                class="pb-style-16"
                style=""
              >
                <path
                  d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"
                  class="pb-style-17"
                  style=""
                ></path></svg>
          </span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
